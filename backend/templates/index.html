<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title>
<link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Lexical logo match stub with confidence-ranked candidates.</p>
<form method="post" action="/ui/jobs"><input name="asset_name" placeholder="banner.png" required/>
    <input name="hint_text" placeholder="Contains Acme logo watermark" required/><button>Scan</button></form>
    <ul>{% for j in jobs %}<li>{{ j.asset_name }} — {{ j.status }}</li>{% endfor %}</ul>
</main></body></html>
